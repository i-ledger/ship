<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data driver/kernet · i-Shipping</title><link rel="icon" href="pertamina-logoicon.png"><link rel="stylesheet" href="style.css"></head><body>
<main class="wrap narrow">
<section class="card" style="margin-bottom:16px"><h2>Tambah driver/kernet</h2>
<div class="row"><input class="grow" id="n" placeholder="Nama" style="text-transform:uppercase"><button class="btn" id="add">Tambah</button></div></section>
<div class="tw"><table class="stack"><thead><tr><th>No</th><th>Nama</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</main>
<script src="config.js"></script><script src="app.js"></script><script>
(()=>{if(!S.guard())return;S.bar('Data driver/kernet');let data=[];
const nm=r=>r.nama||r;
async function load(){S.spin(1);try{data=await S.api(getAPIUrl('get')+'&sheet=namakaryawan');
$('#tb').innerHTML=data.map((r,i)=>`<tr><td data-l="No">${i+1}</td><td data-l="Nama">${esc(nm(r))}</td><td class="act"><button class="btn ghost sm" data-a="e" data-i="${i}">Ubah</button> <button class="btn danger sm" data-a="d" data-i="${i}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="3" class="empty">Belum ada driver/kernet. Tambahkan satu di atas.</td></tr>'}catch(e){S.toast('Data gagal dimuat: '+e.message,false)}S.spin(0)}
async function run(act,payload){S.spin(1);try{await S.api(getAPIUrl(act),{sheet:'namakaryawan',action:act,payload});await load()}catch(e){S.toast('Gagal: '+e.message,false);S.spin(0)}}
$('#add').onclick=()=>{const n=$('#n').value.trim().toUpperCase();if(!n)return S.toast('Nama tidak boleh kosong',false);run('add',{values:[n]});$('#n').value=''};
$('#n').onkeydown=e=>{if(e.key==='Enter')$('#add').click()};
$('#tb').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;
 if(b.dataset.a==='e'){const v=await S.dialog({title:'Ubah nama',fields:[{label:'Nama',value:nm(data[i])}]});if(v&&v[0])run('edit',{row:i+2,values:[v[0]]})}
 else if(await S.dialog({title:'Hapus driver/kernet?',msg:nm(data[i]),ok:'Hapus',danger:1}))run('delete',{row:i+2})};
load()})();
</script></body></html>
