<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard · i-Shipping</title><link rel="icon" href="pertamina-logoicon.png"><link rel="stylesheet" href="style.css"></head><body>
<section class="hero"><div class="in">
<p id="tgl"></p><h2 id="pt">-</h2>
<div class="chips"><div class="chip"><b id="cN">…</b><span>Pengiriman hari ini</span></div><div class="chip"><b id="cQ">…</b><span>Tabung 3 Kg</span></div><div class="chip"><b id="cR">…</b><span>Retur</span></div></div>
<a class="btn" href="https://i-shipping.pages.dev/">Isi form pengiriman</a>
</div></section>
<main class="wrap pull"><div class="tiles">
<a class="tile" href="admin.html"><div class="ic b"><svg viewBox="0 0 24 24"><path d="M9 5h11M9 12h11M9 19h11M4 5h.01M4 12h.01M4 19h.01"/></svg></div><b>Rekap pengiriman</b><span>Lihat, filter, dan unduh data pengiriman</span></a>
<a class="tile" href="daftarpos.html"><div class="ic r"><svg viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></div><b>Data pangkalan</b><span>Tambah, ubah, atau impor dari Excel</span></a>
<a class="tile" href="datakaryawan.html"><div class="ic g"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 010 7M18 14.5c2.2.6 3.5 2.4 3.5 5.5"/></svg></div><b>Data driver/kernet</b><span>Kelola nama driver dan kernet</span></a>
<a class="tile" href="https://i-shipping.pages.dev/mastership.html"><div class="ic b"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg></div><b>Master data i-Shipping</b><span>Kelola master data</span></a>
</div></main>
<script src="config.js"></script><script src="app.js"></script><script>
if(S.guard()){S.bar('Dashboard',{back:false,extra:'<button class="btn ghost sm" id="out">Keluar</button>'});
$('#pt').textContent=localStorage.getItem('nama_pt')||'-';
$('#tgl').textContent=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
$('#out').onclick=()=>{localStorage.clear();location.replace('login.html')};
const num=x=>Number(String(x||0).replace(/\D/g,''))||0,p=n=>String(n).padStart(2,'0'),d0=new Date(),ymd=`${d0.getFullYear()}-${p(d0.getMonth()+1)}-${p(d0.getDate())}`;
S.api(getAPIUrl('transaksi')).then(d=>{
  const t=d.filter(r=>{const x=new Date(r.timestamp);return `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`===ymd});
  $('#cN').textContent=t.length;$('#cQ').textContent=t.reduce((a,r)=>a+num(r.nominal),0).toLocaleString('id-ID');$('#cR').textContent=t.reduce((a,r)=>a+num(r.retur),0).toLocaleString('id-ID')
}).catch(()=>['cN','cQ','cR'].forEach(i=>$('#'+i).textContent='-'))}
</script></body></html>
