<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data pangkalan · i-Shipping</title><link rel="icon" href="pertamina-logoicon.png"><link rel="stylesheet" href="style.css"></head><body>
<main class="wrap">
<section class="card" style="margin-bottom:16px"><h2>Tambah pangkalan</h2>
<div class="row"><input class="grow" id="u" placeholder="Nama pangkalan"><input class="grow" id="p" placeholder="Nama perusahaan"><button class="btn" id="add">Tambah pangkalan</button></div>
<div class="row" style="margin-top:14px"><input class="grow" type="file" id="file" accept=".xlsx,.xls"><button class="btn ghost" id="imp">Impor dari Excel</button></div>
<p class="mut" style="margin-top:8px">Excel: kolom A nama pangkalan, kolom B nama perusahaan.</p></section>
<div class="row" style="margin-bottom:12px"><input class="grow" id="q" type="search" placeholder="Cari pangkalan atau perusahaan"><span class="mut" id="count"></span></div>
<div class="tw"><table class="stack"><thead><tr><th>No</th><th>Nama pangkalan</th><th>Nama perusahaan</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
</main>
<script src="config.js"></script><script src="app.js"></script><script>
(()=>{if(!S.guard())return;S.bar('Data pangkalan');let data=[];
async function load(){S.spin(1);try{data=await S.api(getAPIUrl('get')+'&sheet=POS');draw()}catch(e){S.toast('Data gagal dimuat: '+e.message,false)}S.spin(0)}
function draw(){const q=$('#q').value.trim().toUpperCase();const rows=data.map((r,i)=>[r,i]).filter(([r])=>!q||(r.uraian+' '+r.pos).toUpperCase().includes(q));
$('#count').textContent=`${rows.length} dari ${data.length}`;
$('#tb').innerHTML=rows.map(([r,i])=>`<tr><td data-l="No">${i+1}</td><td data-l="Pangkalan">${esc(r.uraian)}</td><td data-l="Perusahaan">${esc(r.pos)}</td><td class="act"><button class="btn ghost sm" data-a="e" data-i="${i}">Ubah</button> <button class="btn danger sm" data-a="d" data-i="${i}">Hapus</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Belum ada pangkalan. Tambahkan satu di atas.</td></tr>'}
async function run(act,payload){S.spin(1);try{await S.api(getAPIUrl(act),{sheet:'POS',action:act,payload});await load()}catch(e){S.toast('Gagal: '+e.message,false);S.spin(0)}}
$('#add').onclick=()=>{const u=$('#u').value.trim().toUpperCase(),p=$('#p').value.trim().toUpperCase();if(!u||!p)return S.toast('Isi nama pangkalan dan perusahaan',false);run('add',{values:[u,p]});$('#u').value=$('#p').value=''};
$('#q').oninput=draw;
$('#tb').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i,r=data[i];
 if(b.dataset.a==='e'){const v=await S.dialog({title:'Ubah pangkalan',fields:[{label:'Nama pangkalan',value:r.uraian},{label:'Nama perusahaan',value:r.pos}]});if(v&&v[0]&&v[1])run('edit',{row:i+2,values:v})}
 else if(await S.dialog({title:'Hapus pangkalan?',msg:r.uraian,ok:'Hapus',danger:1}))run('delete',{row:i+2})};
$('#imp').onclick=async()=>{const f=$('#file').files[0];if(!f)return S.toast('Pilih file Excel dulu',false);S.spin(1);
try{await new Promise((ok,no)=>{if(window.XLSX)return ok();const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.4/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('Pustaka Excel gagal dimuat'));document.head.append(s)});
const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}).filter(r=>r[0]&&r[1]);
let i=0,fail=0;const w=async()=>{while(i<rows.length){const r=rows[i++];try{await S.api(getAPIUrl('add'),{sheet:'POS',action:'add',payload:{values:[String(r[0]).trim(),String(r[1]).trim()]}})}catch{fail++}}};
await Promise.all([w(),w(),w()]);S.toast(`${rows.length-fail} dari ${rows.length} baris diimpor`,!fail);$('#file').value='';await load()}catch(e){S.toast(e.message,false)}S.spin(0)};
load()})();
</script></body></html>
