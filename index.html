<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Form pengiriman · i-Shipping</title><link rel="icon" href="pertamina-logoicon.png"><link rel="stylesheet" href="style.css"></head><body>
<script>if(/github\.io$/.test(location.hostname))location.replace("https://i-shipping.pages.dev/")</script>
<main class="wrap narrow">
<div id="warn" class="warn hidden">Perangkat ini belum terhubung ke PT. <a href="login.html">Masuk dulu</a> agar daftar driver dan pangkalan muncul.</div>
<form id="f" autocomplete="off">
<section class="card"><h2 id="pt">Pengiriman</h2>
<div class="f"><label for="nama">Driver/Kernet</label><select id="nama" required><option value="">Memuat…</option></select></div>
<div class="f"><label for="uraian">Nama pangkalan</label><input list="ul" id="uraian" required placeholder="Ketik untuk mencari"><datalist id="ul"></datalist></div>
<div class="f"><label for="pos">Nama PT</label><input id="pos" readonly></div>
<div class="f"><label for="nominal">Jumlah pengiriman LPG 3 Kg</label><input id="nominal" required inputmode="numeric"></div>
<div class="f"><label for="bgYN">Driver mengirim Bright Gas?</label><select id="bgYN"><option>Tidak</option><option>Ya</option></select></div>
<div id="bgBox" class="grid g2 hidden"><div class="f"><label for="bg12">12 Kg (tabung)</label><input type="number" id="bg12" min="0" value="0" inputmode="numeric"></div><div class="f"><label for="bg55">5,5 Kg (tabung)</label><input type="number" id="bg55" min="0" value="0" inputmode="numeric"></div></div>
</section>
<section class="card"><h2>Foto pangkalan</h2>
<div class="cam"><video id="videoNota" autoplay playsinline muted></video><canvas id="canvasNota"></canvas><img id="previewNota" class="hidden" alt="Foto pangkalan"></div>
<button type="button" id="ambilNota" class="btn block" onclick="takeSnapshot('Nota')">Ambil foto</button></section>
<section class="card"><h2>Retur</h2>
<div class="f"><label for="retur">Jumlah retur</label><input type="number" id="retur" min="0" value="0" required inputmode="numeric"></div>
<div id="returBox" class="hidden"><label>Foto retur</label><div class="cam"><video id="videoRetur" autoplay playsinline muted></video><canvas id="canvasRetur"></canvas><img id="previewRetur" class="hidden" alt="Foto retur"></div>
<button type="button" id="ambilRetur" class="btn block" onclick="takeSnapshot('Retur')">Ambil foto</button></div></section>
<section class="card"><h2>Konfirmasi pemilik</h2>
<div class="f"><label for="pembayaran">Pemilik pangkalan ada di lokasi?</label><select id="pembayaran"><option>Tidak</option><option>Ya</option></select></div>
<div id="buktiBox" class="hidden"><label>Foto pemilik dan pangkalan</label><div class="cam"><video id="videoBukti" autoplay playsinline muted></video><canvas id="canvasBukti"></canvas><img id="previewBukti" class="hidden" alt="Foto pemilik"></div>
<button type="button" id="ambilBukti" class="btn block" onclick="takeSnapshot('Bukti')">Ambil foto</button></div></section>
<button class="btn block" id="go" style="margin-top:16px;min-height:52px;font-size:1.05rem">Simpan pengiriman</button>
</form></main>
<script src="config.js"></script><script src="app.js"></script><script src="kamera-kanvas.js"></script>
<script>
S.bar('Form pengiriman',{back:false,extra:'<a class="btn ghost sm" href="dashboard.html">Dashboard</a>'});
if(!localStorage.getItem('id_spreadsheet'))$('#warn').classList.remove('hidden');
$('#pt').textContent=localStorage.getItem('nama_pt')||'Pengiriman';
const nama=$('#nama'),uraian=$('#uraian'),pos=$('#pos'),nominal=$('#nominal'),bgYN=$('#bgYN');let map={};
S.api(getAPIUrl('nama')).then(d=>{nama.innerHTML='<option value="" disabled selected>Pilih nama</option>'+d.map(n=>`<option>${esc(n)}</option>`).join('')}).catch(()=>S.toast('Daftar driver gagal dimuat',false));
S.api(getAPIUrl('pos')).then(d=>{d.forEach(r=>map[r.uraian]=r.pos);$('#ul').innerHTML=d.map(r=>`<option value="${esc(r.uraian)}">`).join('')}).catch(()=>S.toast('Daftar pangkalan gagal dimuat',false));
uraian.oninput=()=>pos.value=map[uraian.value]||'';
nominal.oninput=e=>{const v=e.target.value.replace(/\D/g,'');e.target.value=v?new Intl.NumberFormat('id-ID').format(v):''};
bgYN.onchange=()=>$('#bgBox').classList.toggle('hidden',bgYN.value!=='Ya');
$('#f').onsubmit=async e=>{
  e.preventDefault();
  const retur=parseInt($('#retur').value)||0,bayar=$('#pembayaran').value;
  if(!pos.value)return S.toast('Pilih pangkalan dari daftar',false);
  if(!window.fotoNotaBase64)return S.toast('Foto pangkalan wajib diambil',false);
  if(retur>0&&!window.fotoReturBase64)return S.toast('Foto retur wajib diambil',false);
  if(bayar==='Ya'&&!window.fotoBuktiBase64)return S.toast('Foto pemilik wajib diambil',false);
  const btn=$('#go');btn.disabled=true;S.spin(1);
  const done=()=>{btn.disabled=false;S.spin(0)};
  navigator.geolocation.getCurrentPosition(async g=>{
    const brightgas=bgYN.value==='Ya'?`${parseInt($('#bg12').value)||0} Tbg (12kg) || ${parseInt($('#bg55').value)||0} Tbg (5,5 KG)`:'0';
    try{
      const r=await S.api(getAPIUrl('submit'),{action:'addTransaksi',sheet:'Transaksi',payload:{nama:nama.value,uraian:uraian.value,pos:pos.value,nominal:nominal.value.replace(/\D/g,''),pembayaran:bayar,fotoNota:window.fotoNotaBase64,fotoBukti:window.fotoBuktiBase64||'',brightgas,retur,returFoto:window.fotoReturBase64||'',lokasi:`https://www.google.com/maps?q=${g.coords.latitude},${g.coords.longitude}`}});
      if(r.status!=='success')throw new Error(r.message||'Gagal menyimpan');
      S.toast('Pengiriman tersimpan. Terima kasih!');$('#f').reset();pos.value='';$('#bgBox').classList.add('hidden');resetCameras();scrollTo({top:0,behavior:'smooth'});
    }catch(err){S.toast('Gagal: '+err.message,false)}
    done();
  },()=>{S.toast('Lokasi tidak terbaca. Aktifkan izin lokasi lalu coba lagi',false);done()},{timeout:12000,maximumAge:60000});
};
</script></body></html>
